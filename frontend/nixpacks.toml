# nixpacks.toml
# Configuration file for Nixpacks deployment

[variables]
NIXPACKS_NODE_VERSION = "20"
NODE_ENV = "production"

[phases.build]
cmds = [
  'COMMIT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")',
  'export COMMIT_SHA',
  'echo "Building with commit: $COMMIT_SHA"',
  'pnpm run build'
]

[start]
cmd = "npx serve dist -l 3000"