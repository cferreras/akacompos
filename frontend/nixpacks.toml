[phases.setup]
nixPkgs = ['nodejs_20', 'pnpm', 'git']
cmds = [
  # Intentar git desde directorio actual, luego padre, finalmente unknown
  'git rev-parse --short HEAD > /tmp/commit_hash.txt 2>/dev/null || git -C .. rev-parse --short HEAD > /tmp/commit_hash.txt 2>/dev/null || echo "unknown" > /tmp/commit_hash.txt'
]

[phases.install]
cmds = ['pnpm install']

[phases.build]
cmds = [
  # Leer el commit hash del archivo temporal y exportarlo como variable de entorno
  'export COMMIT_SHA=$(cat /tmp/commit_hash.txt 2>/dev/null || echo "unknown")',
  'echo "Building with commit: $COMMIT_SHA"',
  'pnpm run build'
]

[start]
cmd = 'pnpm start'